name: Tests

# meal-mate has no root package.json — backend and frontend are separate
# npm projects, tested by separate jobs. Both gate the deploy.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Runs on a self-hosted runner on the lab host itself — GitHub's own hosted
  # runners can't reach this private host. Gated to push-to-main ONLY
  # (never pull_request) so untrusted PR code can never execute here; this
  # job only ever runs post-merge, already-trusted code. Delegates the
  # actual deploy to sentinel's own guarded engine. No containerName
  # passed — meal-mate runs 2 containers (api + web) from one compose file,
  # so the health-check covers all of them rather than just one.
  deploy:
    name: Deploy to lab
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab]
    steps:
      - name: Trigger sentinel deploy
        run: |
          curl -sf -X POST http://127.0.0.1:7891/api/deploy \
            -H 'Content-Type: application/json' \
            -d '{"repo":"meal-mate"}' \
            -o deploy-result.json
          cat deploy-result.json
          jq -e '.deployStatus == "done"' deploy-result.json
