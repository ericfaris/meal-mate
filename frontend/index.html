<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Meal Mate</title>
    <style>
      /* Self-hosted variable fonts (latin subset). Family names match
         FONT_BODY / FONT_DISPLAY in src/platform/reactNative.tsx. */
      @font-face {
        font-family: 'Karla';
        src: url('/fonts/Karla-Variable.woff2') format('woff2');
        font-weight: 300 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('/fonts/Fraunces-Variable.woff2') format('woff2');
        font-weight: 300 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('/fonts/Fraunces-Italic-Variable.woff2') format('woff2');
        font-weight: 300 900;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Ionicons';
        src: url('/fonts/Ionicons.ttf') format('truetype');
        font-display: block;
      }
      /* react-native-web recommended reset: full-height root, no body scroll
         (ScrollView handles scrolling). */
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #FDFAF6;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
